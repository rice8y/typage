[package]
name = "typage"
version = "0.1.5"
edition = "2021"
rust-version = "1.92"
description = "A Rust static site generator powered by Typst HTML Export"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/rice8y/typage"
repository = "https://github.com/rice8y/typage"
keywords = ["typst", "ssg", "static-site", "html", "cli"]
categories = ["command-line-utilities", "template-engine", "web-programming"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/docs/**",
  "/LICENSE",
  "/src/**",
  "/tests/**",
  "/config.toml",
  "/content/**",
  "/templates/**",
  "/static/**",
]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
typst = "=0.15.1"
typst-bundle = "=0.15.1"
typst-html = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime", "emit-diagnostics"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-syntax = "=0.15.1"
comemo = "0.5.1"
walkdir = "2.5"

tempfile = "3"
